<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Kreol'Digital</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --lagoon:#0F4C4A; --lagoon-deep:#0A3735; --foam:#FAF7F0;
    --coral:#EF5B3B; --gold:#E3A93E; --teal-tint:#DCEEEA;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Inter', sans-serif;
    background: var(--lagoon);
    background-image: radial-gradient(ellipse 900px 500px at 88% -8%, rgba(227,169,62,0.20), transparent 60%),
                       radial-gradient(ellipse 700px 600px at -10% 105%, rgba(239,91,59,0.16), transparent 55%);
    color: var(--foam);
    display:flex; align-items:center; justify-content:center;
    padding: 32px;
  }
  .wrap{ max-width:560px; text-align:center; }

  .mark{ width:64px; margin:0 auto 28px; }

  .code{
    font-family:'Fraunces', serif; font-weight:900; font-size: clamp(64px,14vw,110px);
    line-height:1; letter-spacing:-2px; color: var(--foam);
  }
  .code em{ font-style:normal; color: var(--coral); }

  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size: clamp(20px,3vw,26px);
    margin-top:18px; color: var(--foam);
  }
  p{
    font-size:15.5px; line-height:1.6; color:#DCEEEA;
    max-width:420px; margin: 14px auto 0;
  }

  .actions{ margin-top:34px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    font-weight:600; font-size:15px; padding:13px 26px; border-radius:999px;
    text-decoration:none; transition: transform .18s ease, background-color .18s ease;
  }
  .btn-coral{ background: var(--coral); color:#fff; box-shadow:0 6px 18px rgba(239,91,59,0.28); }
  .btn-coral:hover{ background:#D6472A; transform: translateY(-1px); }
  .btn-ghost{ background:transparent; color: var(--foam); border:1.5px solid rgba(250,247,240,0.4); }
  .btn-ghost:hover{ border-color: var(--foam); background: rgba(250,247,240,0.08); }

  .wave{ width:220px; margin: 44px auto 0; opacity:0.85; }

  .contact{
    margin-top:40px; font-family:'IBM Plex Mono', monospace; font-size:12px;
    letter-spacing:0.5px; color:#9FC2BC;
  }
  .contact a{ color: var(--gold); text-decoration:none; }
  .contact a:hover{ text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="mark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><radialGradient id="bg404" cx="80%" cy="15%" r="90%">
        <stop offset="0%" stop-color="#1C6864"/><stop offset="45%" stop-color="#0F4C4A"/><stop offset="100%" stop-color="#0A3735"/>
      </radialGradient></defs>
      <circle cx="100" cy="100" r="97" fill="url(#bg404)" stroke="#FAF7F0" stroke-width="2"/>
      <g transform="translate(100,100) scale(0.87) translate(-100,-100)">
        <path d="M32,100 C48,77 62,77 78,100 C94,123 108,123 124,100" fill="none" stroke="#E3A93E" stroke-width="7" stroke-linecap="round"/>
        <path d="M124,100 L140,100 L150,64 L162,136 L172,100 L184,100" fill="none" stroke="#EF5B3B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="78" cy="100" r="4.5" fill="#FAF7F0"/><circle cx="184" cy="100" r="6" fill="#FAF7F0"/>
      </g>
    </svg>

    <div class="code">4<em>0</em>4</div>
    <h1>Cette page n'existe pas — ou plus.</h1>
    <p>Le lien est peut-être ancien, ou l'adresse comporte une petite erreur. Pas d'inquiétude,
      tout le reste du site fonctionne très bien.</p>

    <div class="actions">
      <a href="/" class="btn btn-coral">Retour à l'accueil</a>
      <a href="/#contact" class="btn btn-ghost">Nous contacter</a>
    </div>

    <svg class="wave" viewBox="0 0 220 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M0,20 C25,5 35,5 50,20 C65,35 75,35 90,20 C105,5 115,5 130,20 L145,20 L152,4 L162,36 L170,20 L178,26 L186,20 L220,20"
        fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
    </svg>

    <p class="contact">Kreol'Digital — <a href="mailto:p.godran@kreoldigital.fr">p.godran@kreoldigital.fr</a> · 06 90 50 48 87</p>
  </div>
</body>
</html>
